name: Core C++ CI (no models)
on:
  push:
    branches:
      - main
      - dev
      - "prototype/**"
      - "feature/**"
      - "fix/**"
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DAIMJ_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Mock scheduling smoke test
        shell: bash
        run: |
          mkdir -p benchmarks/results
          if [[ "${{ runner.os }}" == "Windows" ]]; then exe="./build/Release/aimj_bench.exe"; else exe="./build/aimj_bench"; fi
          "$exe" --events 10 --hz 8 --llm-delay-ms 10 --tts-delay-ms 5 --out benchmarks/results/ci.jsonl
  npc-contract:
    name: npc-contract (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install jsonschema
        run: python -m pip install jsonschema==4.23.0
      - name: NPC contract self-test
        run: python docs/npc/validate_examples.py --self-test
